<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CivicPin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>CivicPin</h1></header>
  <main>
    <div id="map"></div>
    <form id="report-form">
      <p id="location-hint">Click the map to set the location</p>
      <select name="category" required>
        <option value="waterlogging">Waterlogging</option>
        <option value="drain">Blocked drain</option>
        <option value="pothole">Pothole</option>
        <option value="garbage">Garbage</option>
        <option value="other">Other</option>
      </select>
      <select name="severity" required>
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <textarea name="description" maxlength="500" placeholder="What's the problem?"></textarea>
      <button type="submit">Report issue</button>
    </form>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
